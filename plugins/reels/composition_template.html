<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>$title</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=block" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: #0a1628; font-family: 'Montserrat', sans-serif; color: #fff;
      }
      .scene { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
      .scene video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; filter: contrast(1.05) saturate(0.95) brightness(0.95);
      }
      .scene .grad-fallback {
        position: absolute; inset: 0;
      }
      .grad-urgent  { background: linear-gradient(135deg, #1f2937 0%, #b91c1c 100%); }
      .grad-upbeat  { background: linear-gradient(135deg, #312e81 0%, #f59e0b 100%); }
      .grad-calm    { background: linear-gradient(135deg, #064e3b 0%, #047857 100%); }
      .grad-neutral { background: linear-gradient(135deg, #0f1729 0%, #1e3a8a 100%); }
      .vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
      }
      .brand {
        position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.55); backdrop-filter: blur(14px);
        padding: 12px 30px; border-radius: 100px;
        color: #fbbf24; font-size: 26px; font-weight: 900; letter-spacing: 0.08em;
        opacity: 0; z-index: 100;
      }
      .caption-zone {
        position: absolute; bottom: 22%; left: 0; right: 0;
        display: flex; justify-content: center; pointer-events: none; z-index: 50;
      }
      .caption-text {
        color: #fff; font-size: 88px; font-weight: 900; letter-spacing: -0.025em;
        text-align: center; padding: 0 60px; line-height: 1.05;
        text-shadow: 0 6px 20px rgba(0,0,0,0.85), 0 0 8px rgba(0,0,0,0.95);
        -webkit-text-stroke: 4px rgba(0,0,0,0.9);
        opacity: 0; transform: translateY(40px) scale(0.88);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="$total_dur" data-width="1080" data-height="1920">

      <!-- AUDIO TRACKS -->
$audio_blocks

      <!-- BRAND BADGE -->
      <div id="brand" class="brand" data-start="0" data-duration="$total_dur" data-track-index="9">@TADBIRKOR.AI</div>

      <!-- SCENES -->
$scene_blocks

      <!-- CAPTIONS -->
      <div id="captions" data-composition-id="captions" data-start="0" data-duration="$total_dur" data-track-index="3" data-width="1080" data-height="1920">
        <div class="caption-zone">
          <div id="cap" class="caption-text">&nbsp;</div>
        </div>
        <script>
          (function() {
            const tl = gsap.timeline({ paused: true });
            const cap = document.querySelector('#cap');
            const phrases = $phrases_json;
            phrases.forEach(function(p) {
              tl.set(cap, { innerText: p.text, opacity: 0, y: 40, scale: 0.88 }, p.start);
              tl.to(cap, { opacity: 1, y: 0, scale: 1, duration: 0.18, ease: "back.out(1.7)" }, p.start);
              tl.to(cap, { opacity: 0, y: -22, scale: 0.94, duration: 0.14, ease: "power2.in" }, p.end);
            });
            window.__timelines = window.__timelines || {};
            window.__timelines["captions"] = tl;
          })();
        </script>
      </div>
    </div>

    <!-- MAIN TIMELINE: brand + scene fades -->
    <script>
      window.__timelines = window.__timelines || {};
      const main = gsap.timeline({ paused: true });
      main.fromTo("#brand", { opacity: 0, y: -10 }, { opacity: 0.88, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
      main.to("#brand", { opacity: 0, duration: 0.4 }, $brand_out_at);
$main_timeline_lines
      window.__timelines["main"] = main;
    </script>
  </body>
</html>
